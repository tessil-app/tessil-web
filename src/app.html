<!doctype html>
<html lang="%tessil.lang%">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Only invariant tags live here. Title, description, robots, canonical and
         the per-page og/twitter pairs come from $lib/components/Seo.svelte, so
         prerendered HTML carries them. Never add a static title tag here: it
         would win on document order and mask every route. Never write the
         SvelteKit head placeholder token in this comment either, because only
         the first occurrence in the file is substituted, and it would consume
         the real one below. -->
    <meta
      name="theme-color"
      media="(prefers-color-scheme: light)"
      content="#fafaf7"
    />
    <meta
      name="theme-color"
      media="(prefers-color-scheme: dark)"
      content="#0e0f12"
    />
    <meta name="referrer" content="no-referrer" />
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/fonts/Switzer-Variable.woff2"
      crossorigin
    />
    <meta property="og:site_name" content="Tessil" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://tessil.app%tessil.ogimage%" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://tessil.app%tessil.ogimage%" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="tap" class="bg-background text-foreground">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
